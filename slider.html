<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Premium Auto Slider</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-slate-900 via-purple-900 to-slate-900 min-h-screen flex items-center justify-center">

  <div class="relative w-full max-w-5xl h-[450px] overflow-hidden rounded-3xl shadow-2xl group">

  
    <div id="slider" class="flex transition-transform duration-700 ease-in-out h-full">

 
      <div class="min-w-full relative">
        <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e"
             class="w-full h-full object-cover">
        <div class="absolute inset-0 bg-black/40 flex items-center justify-center">
          <h1 class="text-white text-4xl md:text-6xl font-bold tracking-wide">
            Explore Naeture
          </h1>
        </div>
      </div>

 
      <div class="min-w-full relative">
        <img src="https://images.unsplash.com/photo-1492724441997-5dc865305da7"
             class="w-full h-full object-cover">
        <div class="absolute inset-0 bg-black/40 flex items-center justify-center">
          <h1 class="text-white text-4xl md:text-6xl font-bold tracking-wide">
            Feel The Freedom
          </h1>
        </div>
      </div>

      <div class="min-w-full relative">
        <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee"
             class="w-full h-full object-cover">
        <div class="absolute inset-0 bg-black/40 flex items-center justify-center">
          <h1 class="text-white text-4xl md:text-6xl font-bold tracking-wide">
            Chase Your Dreams
          </h1>
        </div>
      </div>

    </div>

    <button id="prev"
      class="absolute top-1/2 -translate-y-1/2 left-5 bg-white/20 backdrop-blur-md hover:bg-white/40 text-white p-3 rounded-full opacity-0 group-hover:opacity-100 transition">
      ❮
    </button>

    <button id="next"
      class="absolute top-1/2 -translate-y-1/2 right-5 bg-white/20 backdrop-blur-md hover:bg-white/40 text-white p-3 rounded-full opacity-0 group-hover:opacity-100 transition">
      ❯
    </button>

  
    <div class="absolute bottom-6 w-full flex justify-center gap-3">
      <span class="dot w-3 h-3 bg-white/50 rounded-full cursor-pointer"></span>
      <span class="dot w-3 h-3 bg-white/50 rounded-full cursor-pointer"></span>
      <span class="dot w-3 h-3 bg-white/50 rounded-full cursor-pointer"></span>
    </div>

  </div>

<script>
  const slider = document.getElementById("slider");
  const slides = document.querySelectorAll("#slider > div");
  const dots = document.querySelectorAll(".dot");
  const nextBtn = document.getElementById("next");
  const prevBtn = document.getElementById("prev");

  let index = 0;
  const totalSlides = slides.length;

  function updateSlider() {
    slider.style.transform = `translateX(-${index * 100}%)`;
    dots.forEach(dot => dot.classList.remove("bg-white"));
    dots[index].classList.add("bg-white");
  }

  function nextSlide() {
    index = (index + 1) % totalSlides;
    updateSlider();
  }

  function prevSlide() {
    index = (index - 1 + totalSlides) % totalSlides;
    updateSlider();
  }

  nextBtn.addEventListener("click", nextSlide);
  prevBtn.addEventListener("click", prevSlide);

  dots.forEach((dot, i) => {
    dot.addEventListener("click", () => {
      index = i;
      updateSlider();
    });
  });

  setInterval(nextSlide, 4000);

  updateSlider();
</script>

</body>
</html>
