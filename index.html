<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Management CRUD</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Product Management Page</h1>

        <section class="card">
            <h2>Add / Edit Product</h2>
            <form id="productForm">
                <input type="hidden" id="editId">
                
                <div class="input-group">
                    <input type="text" id="title" placeholder="Product Title" required>
                    <input type="number" id="price" placeholder="Price ($)" required min="0" step="0.01">
                </div>
                <div class="input-group">
                    <input type="url" id="image" placeholder="Image URL (Optional)">
                    <select id="category" required>
                        <option value="" disabled selected>Select Category</option>
                        <option value="Electronics">Electronics</option>
                        <option value="Clothing">Clothing</option>
                        <option value="Home">Home</option>
                        <option value="Books">Books</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <button type="submit" id="submitBtn">Add Product</button>
            </form>
        </section>

        <section class="card controls">
            <input type="text" id="searchInput" placeholder="Search by title...">
            <select id="filterCategory">
                <option value="All">All Categories</option>
                <option value="Electronics">Electronics</option>
                <option value="Clothing">Clothing</option>
                <option value="Home">Home</option>
                <option value="Books">Books</option>
                <option value="Other">Other</option>
            </select>
            <select id="sortPrice">
                <option value="default">Sort by Price</option>
                <option value="lowToHigh">Low to High</option>
                <option value="highToLow">High to Low</option>
            </select>
        </section>

        <section>
            <div id="productList" class="product-grid">
                </div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
